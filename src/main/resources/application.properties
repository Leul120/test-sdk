spring.application.name=sdk-spring-boot-demo

# Server Configuration
server.port=8085
server.servlet.context-path=/api

# AI-Synapse SDK Configuration
# Transport Configuration

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Connection Pool Configuration (for testing CONNECTION_POOL_EXHAUSTION)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=products,orders

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Logging Configuration
logging.level.com.example.sdkdemo=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.aisynapse.sdk=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Application-specific Configuration
app.name=E-Commerce Demo App
app.version=1.0.0
app.failure-injection.enabled=true

# Thread Pool Configuration (for testing CPU_PRESSURE)
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# HTTP Client Configuration (for testing TIMEOUT_ISSUES)
spring.http.client.connect-timeout=5000
spring.http.client.read-timeout=10000

# Custom Configuration for Testing
app.chaos.enabled=true
app.chaos.failure-probability=0.1
app.chaos.latency-min-ms=100
app.chaos.latency-max-ms=2000
